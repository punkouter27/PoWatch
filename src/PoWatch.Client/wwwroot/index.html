<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PoWatch</title>
    <base href="/" />
    <!-- The Radzen theme sits in @layer vendor, so every unlayered app sheet below wins over it, and
         class "pw-plain" (terminal-base.css, @layer plain) gives a Radzen control the app's own look. -->
    <style>
        @layer vendor, plain;
        @import url("_content/Radzen.Blazor/css/material-base.css") layer(vendor);
    </style>
    <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" href="_content/Radzen.Blazor/fonts/MaterialSymbolsOutlined.woff2" />
    <!-- Po web standard: the estate tokens, self-hosted Inter + Space Grotesk and the shell styles
         (header, version stamp, /diag cards) come first among the app's sheets (after Radzen's base,
         whose --rz-* variables they re-point); terminal-tokens.css aliases this app's own onto them. -->
    <link rel="stylesheet" href="css/po-tokens.css" />
    <link rel="stylesheet" href="css/terminal-tokens.css" />
    <link rel="stylesheet" href="css/po-motion.css" />
    <link rel="stylesheet" href="css/terminal-base.css" />
    <link rel="stylesheet" href="css/terminal-shell.css" />
    <link rel="stylesheet" href="css/terminal-pages.css" />
    <link rel="stylesheet" href="css/terminal-overlays.css" />
    <link rel="stylesheet" href="css/terminal-dash.css" />
    <link rel="stylesheet" href="css/terminal-journal.css" />
    <link rel="stylesheet" href="css/po-polish.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link href="PoWatch.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- All app-specific JS bridges load in <head> with defer: defer scripts execute after the
         document is parsed but before DOMContentLoaded, so the globals (`powatchInference`,
         …) are attached before Blazor's first OnAfterRenderAsync interop call. Light or dark
         follows the device (prefers-color-scheme); there is no theme script. -->
    <script src="js/error-report.js"></script>
    <!-- Tab with nothing focused opens the developer window (/po-dev.html). -->
    <script src="js/po-devwindow.js"></script>
    <script src="js/idb.js" defer></script>
    <script src="js/local-day.js" defer></script>
    <script src="js/worker-rpc.js" defer></script>
    <script src="js/sensing/camera.js" defer></script>
    <script src="js/sensing/inference-bridge.js" defer></script>
    <script src="js/sensing/pixel-layer.js" defer></script>
    <script src="js/sensing/audio-layer.js" defer></script>
    <script src="js/sensing/detector-bridge.js" defer></script>
    <script src="js/face-overlay.js" defer></script>
    <script src="js/body-overlay.js" defer></script>
    <script src="js/sensing/feed-dock.js" defer></script>
    <script src="js/blob-upload.js" defer></script>
    <script src="js/outbox.js" defer></script>
    <script src="js/caption-index.js" defer></script>
    <script src="js/timelapse.js" defer></script>
    <script src="js/files.js" defer></script>
    <script src="js/menus.js" defer></script>
    <script src="js/live-layout.js" defer></script>
    <script src="js/cues.js" defer></script>
    <script src="js/tts.js" defer></script>
    <script src="js/visuals.js" defer></script>
    <script src="js/demo-flow.js" defer></script>
    <script src="js/fx.js" defer></script>
    <script src="js/heat-gl.js" defer></script>
    <script src="js/fluid-gpu.js" defer></script>
    <script src="js/pose-3d.js" defer></script>
    <script src="js/replay-flow.js" defer></script>
    <script src="js/posture-cloth.js" defer></script>
    <script src="js/replay.js" defer></script>
    <script src="js/local-ai.js" defer></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- All app-specific JS bridges now load in <head> with defer (see above). Only the
         Radzen vendor bundle and Blazor runtime remain in <body>. -->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker?.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
