name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      emergency:
        description: 'Emergency deploy: skip the formatting and test gates (use only when production is down and the fix must ship now)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: PoWatch.slnx
  API_PROJECT_PATH: src/PoWatch.Api/PoWatch.Api.csproj

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      webapp_name: ${{ steps.deployment.outputs.webapp_name }}
      resource_group: ${{ steps.deployment.outputs.resource_group }}
    steps:
      - uses: actions/checkout@v7
      - name: Read authoritative deployment settings
        id: deployment
        shell: pwsh
        run: |
          $settings = Get-Content infra/deployment.json -Raw | ConvertFrom-Json
          "webapp_name=$($settings.webAppName)" >> $env:GITHUB_OUTPUT
          "resource_group=$($settings.solutionResourceGroupName)" >> $env:GITHUB_OUTPUT
      - name: Check repository hygiene
        shell: pwsh
        run: ./SCRIPTS/check-hygiene.ps1
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --outfile "${{ runner.temp }}/powatch-template.json"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.SOLUTION_PATH }}
      - run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release
      # Formatting, test caps and all four suites (unit: pure logic; integration, API E2E and UI E2E:
      # Azurite via Testcontainers; UI E2E drives Playwright's Chromium against the app). An emergency
      # deploy skips all of it with this one condition.
      - name: Quality gates (caps, format, unit, integration, API E2E, UI E2E)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.emergency) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./SCRIPTS/check-test-caps.ps1
          dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/PoWatch.E2EUI/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:E2E_LOCAL = '1'
          foreach ($suite in 'Unit', 'Integration', 'E2EAPI', 'E2EUI') {
            dotnet test "tests/PoWatch.$suite/PoWatch.$suite.csproj" -c Release --no-build --logger "trx;LogFileName=$($suite.ToLower()).trx" --results-directory testresults
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: testresults
          retention-days: 7

      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-restore -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    env:
      AZURE_WEBAPP_NAME: ${{ needs.build.outputs.webapp_name }}
      AZURE_RESOURCE_GROUP: ${{ needs.build.outputs.resource_group }}
    environment:
      name: production
      url: https://${{ needs.build.outputs.webapp_name }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: webapp
          path: publish
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      - run: cd publish && zip -r ../webapp.zip . && cd ..
      # Same pair in every Po web repo: keep the live build, and put it back if anything fails once the
      # new package is live (see "Roll back to the previous build" at the end of this job).
      - name: Back up the live site
        id: backup
        run: |
          token=$(az account get-access-token --query accessToken -o tsv)
          if curl -fsS --max-time 300 -H "Authorization: Bearer $token" -o previous.zip \
               "https://${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zip/site/wwwroot/" && [ -s previous.zip ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Backed up $(du -h previous.zip | cut -f1) of the live site."
          else
            echo "::warning title=No backup::Could not download the live site, so this deploy cannot be rolled back."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip
      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}' || true)
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1

      - name: Verify deployment (health + boot readiness gate)
        run: |
          BASE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          sleep 20
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" --max-time 30 || echo "000")
            echo "Health check attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Deployment verified."; exit 0; fi
            sleep 15
          done
          echo "::error::Health check did not return 200 after 5 attempts — the deployment is NOT healthy."
          echo "----- /diag/boot (last startup milestone + dependency readiness) -----"
          curl -s "$BASE/diag/boot" --max-time 30 || echo "(/diag/boot unreachable — the host failed to start; NO in-app endpoint can answer a 500.30)"
          echo ""
          echo "To find the real startup exception:"
          echo "  az webapp log download -n ${{ env.AZURE_WEBAPP_NAME }} -g ${{ env.AZURE_RESOURCE_GROUP }} --log-file logs.zip"
          echo "  then read LogFiles/eventlog.xml — the '.NET Runtime' entries contain the full stack trace."
          exit 1

      - name: Roll back to the previous build
        if: failure() && steps.deploy.outcome == 'success' && steps.backup.outputs.ok == 'true'
        run: |
          az webapp deploy -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path previous.zip --type zip --clean true
          echo "::error title=Rolled back::${{ github.sha }} failed after it went live; the previous build is live again."
