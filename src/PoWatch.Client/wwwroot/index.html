<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PoWatch</title>
    <base href="/" />
    <!-- Local-first (NET_RUN_10): Inter is self-hosted, not loaded from the Google CDN,
         so typography (and the app's offline/vendored supply-chain rule) no longer
         depends on an outbound network request. -->
    <style>
        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("lib/fonts/inter-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
    </style>
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="css/terminal.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#030a12" />
    <link href="PoWatch.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- All app-specific JS bridges load in <head> with defer: defer scripts execute after the
         document is parsed but before DOMContentLoaded, so the globals (`powatchInference`,
         …) are attached before Blazor's first OnAfterRenderAsync interop call.
         NOTE: theme-controller.js runs on this same deferred schedule — before Blazor boots and
         paints the app shell, so there is no theme flash, but it is NOT synchronous. -->
    <script src="js/error-report.js"></script>
    <script src="js/theme-controller.js" defer></script>
    <script src="js/worker-rpc.js" defer></script>
    <script src="js/inference-bridge.js" defer></script>
    <script src="js/sensing/pixel-layer.js" defer></script>
    <script src="js/sensing/audio-layer.js" defer></script>
    <script src="js/sensing/detector-bridge.js" defer></script>
    <script src="js/sensing/feed-dock.js" defer></script>
    <script src="js/blob-upload.js" defer></script>
    <script src="js/outbox.js" defer></script>
    <script src="js/caption-index.js" defer></script>
    <script src="js/timelapse.js" defer></script>
    <script src="js/files.js" defer></script>
    <script src="js/menus.js" defer></script>
    <script src="js/cues.js" defer></script>
    <script src="js/heat-gl.js" defer></script>
    <script src="js/replay.js" defer></script>
    <script src="js/local-ai.js" defer></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- All app-specific JS bridges now load in <head> with defer (see above). Only the
         Radzen vendor bundle and Blazor runtime remain in <body>. -->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js" defer></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker?.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
